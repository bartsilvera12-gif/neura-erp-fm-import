<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<article onMouseEnter="{{ enter }}" onMouseLeave="{{ leave }}" style="display:flex;flex-direction:column;gap:14px;min-width:0;font-family:'Hanken Grotesk',sans-serif;color:#0c0b09">
  <a href="{{ p.href }}" aria-label="{{ p.name }}" style="position:relative;display:block;aspect-ratio:4/5;overflow:hidden;background:#ebe5d8">
    <div style="position:absolute;inset:0;background:repeating-linear-gradient(135deg,#e6dfd1 0 11px,#eee9de 11px 22px);display:flex;align-items:flex-end;padding:14px;transform:scale({{ zoom }});opacity:{{ op1 }};transition:transform .7s cubic-bezier(.2,.7,.2,1),opacity .45s ease">
      <span style="font-family:'IBM Plex Mono',monospace;font-size:10.5px;letter-spacing:.06em;text-transform:uppercase;color:#7a7468">{{ p.photo }}</span>
    </div>
    <div style="position:absolute;inset:0;background:repeating-linear-gradient(45deg,#e2dacb 0 11px,#ebe5d9 11px 22px);display:flex;align-items:flex-end;padding:14px;opacity:{{ op2 }};transition:opacity .45s ease">
      <span style="font-family:'IBM Plex Mono',monospace;font-size:10.5px;letter-spacing:.06em;text-transform:uppercase;color:#7a7468">Segunda foto · detalle</span>
    </div>
  </a>
  <div style="display:flex;flex-direction:column;gap:5px">
    <span style="font-size:10.5px;letter-spacing:.18em;text-transform:uppercase;color:#6b665c">{{ p.brand }}</span>
    <a href="{{ p.href }}" style="font-family:'Bodoni Moda',serif;font-size:20px;line-height:1.15;color:#0c0b09;text-decoration:none" style-hover="text-decoration:underline;text-underline-offset:4px;text-decoration-thickness:1px">{{ p.name }}</a>
    <span style="font-size:13px;color:#6b665c">{{ p.size }}</span>
  </div>
  <sc-if value="{{ wholesale }}" hint-placeholder-val="{{ false }}">
    <div style="display:flex;align-items:center;gap:0;border:1px solid #cfc7b6;width:max-content">
      <button onClick="{{ p.dec }}" aria-label="Restar" style="width:40px;height:40px;border:none;background:transparent;font-size:18px;cursor:pointer;color:#0c0b09">−</button>
      <span style="min-width:40px;text-align:center;font-size:14px;font-variant-numeric:tabular-nums">{{ p.qty }}</span>
      <button onClick="{{ p.inc }}" aria-label="Sumar" style="width:40px;height:40px;border:none;background:transparent;font-size:18px;cursor:pointer;color:#0c0b09">+</button>
    </div>
  </sc-if>
  <div style="display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;border-top:1px solid #d9d1c1;padding-top:12px">
    <span style="font-size:13px;font-weight:600">{{ p.priceLabel }}</span>
    <button onClick="{{ p.add }}" style="background:transparent;border:none;border-bottom:1px solid #0c0b09;padding:6px 0;font-family:'Hanken Grotesk',sans-serif;font-size:12px;letter-spacing:.12em;text-transform:uppercase;cursor:pointer;color:#0c0b09" style-hover="color:#8a6a2c;border-bottom-color:#8a6a2c">{{ p.addLabel }}</button>
  </div>
</article>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:300,&quot;height&quot;:560},&quot;p&quot;:{&quot;editor&quot;:null,&quot;tsType&quot;:&quot;object&quot;},&quot;wholesale&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:false,&quot;tsType&quot;:&quot;boolean&quot;}}">
class Component extends DCLogic {
  state = { h: false };
  renderVals() {
    const h = this.state.h;
    return {
      p: this.props.p || {}, wholesale: !!this.props.wholesale,
      zoom: h ? 1.035 : 1, op1: h ? 0 : 1, op2: h ? 1 : 0,
      enter: () => this.setState({ h: true }), leave: () => this.setState({ h: false })
    };
  }
}
</script>
</body>
</html>
